services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:-tickets}
    ports:
      - "5432:5432"
    volumes:
      - tickets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  tickets-data:
