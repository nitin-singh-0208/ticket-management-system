server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tickets
    username: tickets
    password: ${TICKETS_DB_PASSWORD:tickets}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
