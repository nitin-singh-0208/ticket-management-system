openapi: 3.0.3
info:
  title: Support Ticket Management API
  version: 1.0.0
  description: >
    Phase 1 ticket API. Field names are camelCase. Tickets are addressed by
    public id (TKT-1001). Status changes only through the status operation.
    Every error body is an RFC 7807 problem.
servers:
  - url: http://localhost:8080
paths:
  /api/tickets:
    get:
      operationId: listTickets
      summary: List tickets
      description: >
        Returns matches ordered by createdAt descending, then by human-id
        number descending. When page and size are both omitted, content
        contains every match. The UI omits both and does not page.
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Matching tickets. An empty match set is 200 with content [].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTicket
      summary: Create a ticket
      description: >
        Assigns the next human id and sets status to OPEN. The first id in an
        empty database is TKT-1001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created. Location is /api/tickets/{ticketId}.
          headers:
            Location:
              schema:
                type: string
              description: Absolute or relative URL of the new ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/Problem'
  /api/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/ticketId'
    get:
      operationId: getTicket
      summary: Get one ticket
      description: Comments are oldest first. allowedNextStatuses comes from the server transition map.
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateTicket
      summary: Update editable ticket fields
      description: >
        Does not change ticketId, category, status, or createdAt. An omitted
        property stays unchanged. An explicit null is 400. A present title,
        description, priority, or assignee that is blank is 400.
        resolutionNotes set to an empty string clears the notes. status,
        category, or any other unknown property is 400. Allowed in every
        status, including CLOSED and CANCELLED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: The updated ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/tickets/{ticketId}/status:
    parameters:
      - $ref: '#/components/parameters/ticketId'
    patch:
      operationId: changeTicketStatus
      summary: Change ticket status
      description: >
        The only status write. Allowed pairs succeed with 200. Every other
        pair of the five statuses, including a change to the current status,
        returns 409 and leaves the stored status unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: The ticket in the requested status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          description: The status value is missing or not one of the five names.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The transition is not allowed. The stored status is unchanged.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Changing status from OPEN to CLOSED is not allowed.
                instance: /api/tickets/TKT-1001/status
  /api/tickets/{ticketId}/comments:
    parameters:
      - $ref: '#/components/parameters/ticketId'
    post:
      operationId: addComment
      summary: Add a comment
      description: >
        Append-only. Allowed in every ticket status. Does not change ticket
        status or list position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Created. Location is /api/tickets/{ticketId}/comments/{commentId}.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ticketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        pattern: '^TKT-[0-9]+$'
        example: TKT-1001
    q:
      name: q
      in: query
      required: false
      description: >
        Case-insensitive contiguous substring matched against title or
        description. Trimmed. Omitted or blank means no text filter.
      schema:
        type: string
    status:
      name: status
      in: query
      required: false
      description: When set, only tickets in this status are returned.
      schema:
        $ref: '#/components/schemas/TicketStatus'
    page:
      name: page
      in: query
      required: false
      description: >
        Zero-based page index. Sending page without size is 400. When size
        is present and page is omitted, page is 0.
      schema:
        type: integer
        minimum: 0
    size:
      name: size
      in: query
      required: false
      description: >
        Page size from 1 to 100. When page and size are both omitted, the
        response contains every match. page without size is 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    Problem:
      description: RFC 7807 problem. 400 responses include errors.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    TicketSummary:
      type: object
      additionalProperties: false
      required: [ticketId, title, status, priority, assignee]
      properties:
        ticketId:
          type: string
          example: TKT-1001
        title:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
    Comment:
      type: object
      additionalProperties: false
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    TicketDetail:
      type: object
      additionalProperties: false
      required:
        - ticketId
        - title
        - description
        - priority
        - assignee
        - category
        - status
        - createdAt
        - comments
        - allowedNextStatuses
      properties:
        ticketId:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
        category:
          type: string
        resolutionNotes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        createdAt:
          type: string
          format: date-time
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        allowedNextStatuses:
          type: array
          items:
            $ref: '#/components/schemas/TicketStatus'
    TicketPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
          description: Equals totalElements when the caller omitted page and size.
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required: [title, description, priority, assignee, category]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 100
        resolutionNotes:
          type: string
          maxLength: 5000
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      description: >
        Omit a property to leave the stored value unchanged. An explicit
        null on any property is 400. A present title, description, priority,
        or assignee must be non-blank. resolutionNotes set to an empty
        string clears the notes. Unknown properties, including status and
        category, are 400.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 5000
        priority:
          $ref: '#/components/schemas/Priority'
        assignee:
          type: string
          minLength: 1
          maxLength: 200
        resolutionNotes:
          type: string
          maxLength: 5000
          description: Empty string clears the notes.
    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: Title is required
    Problem:
      type: object
      description: RFC 7807 problem detail. errors is present on validation failures.
      required: [title, status, detail]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
